<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Minemsiyle</title>
    <link rel="icon" href="/assets/images/Logo.png" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:ital,wght@0,400;1,500&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        mumine: '#d4a373',
                        koyu: '#18181b',
                        orta: '#202024',
                        acik: '#27272a',
                        yazi: '#e4e4e7',
                        yaziAcik: '#a1a1aa'
                    }
                }
            }
        }
    </script>

    <!-- Ekstra hafif geçiş efektleri için minimal CSS -->
    <style>
        body {
            background-color: #121214;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .hidden-form {
            display: none;
        }

        /* Modalın yumuşak açılıp kapanması için */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Şifre Kutusunun aşağıdan yukarı kayarak gelmesi */
        .modal-content {
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }
    </style>
</head>

<body class="bg-[#121214] font-sans antialiased selection:bg-mumine selection:text-koyu">

    <!-- ANA GİRİŞ KUTUSU -->
    <div
        class="bg-koyu w-[90%] max-w-md p-8 sm:p-10 rounded-2xl border border-zinc-800 shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative">

        <!-- Tab Menüsü -->
        <div class="flex bg-orta rounded-lg p-1 mb-8">
            <button id="loginTab" onclick="switchTab('login')"
                class="flex-1 py-2 rounded-md text-sm font-medium transition-all duration-300 bg-acik text-mumine shadow-sm">Giriş
                Yap</button>
            <button id="registerTab" onclick="switchTab('register')"
                class="flex-1 py-2 rounded-md text-sm font-medium text-yaziAcik hover:text-yazi transition-all duration-300">Kayıt
                Ol</button>
        </div>

        <div class="text-center mb-8">
            <h2 class="font-serif text-3xl text-mumine mb-2">Mümine'msi</h2>
            <p class="text-yaziAcik text-sm">Okur dünyasına hoş geldin.</p>
        </div>

        <!-- LOGİN FORMU -->
        <form id="loginForm" class="flex flex-col gap-4">
            <div>
                <input type="email" id="loginEmail" placeholder="E-posta Adresi" required
                    class="w-full bg-orta border border-zinc-700 text-yazi px-4 py-3 rounded-lg focus:outline-none focus:border-mumine focus:ring-1 focus:ring-mumine transition-all">
            </div>
            <div>
                <input type="password" id="loginPassword" placeholder="Şifre" required
                    class="w-full bg-orta border border-zinc-700 text-yazi px-4 py-3 rounded-lg focus:outline-none focus:border-mumine focus:ring-1 focus:ring-mumine transition-all">
            </div>

            <div class="text-right mt-1 mb-2">
                <a href="#" onclick="openResetModal()"
                    class="text-xs text-yaziAcik hover:text-mumine transition-colors">Şifremi Unuttum?</a>
            </div>

            <button type="submit"
                class="w-full bg-mumine text-koyu font-semibold py-3 rounded-lg hover:bg-[#e6b88a] active:scale-[0.98] transition-all">Kütüphaneye
                Gir</button>
        </form>

        <!-- REGİSTER FORMU -->
        <form id="registerForm" class="hidden flex-col gap-4">
            <div>
                <input type="text" id="regUsername" placeholder="Kullanıcı Adı" required
                    class="w-full bg-orta border border-zinc-700 text-yazi px-4 py-3 rounded-lg focus:outline-none focus:border-mumine focus:ring-1 focus:ring-mumine transition-all">
            </div>
            <div>
                <input type="email" id="regEmail" placeholder="E-posta Adresi" required
                    class="w-full bg-orta border border-zinc-700 text-yazi px-4 py-3 rounded-lg focus:outline-none focus:border-mumine focus:ring-1 focus:ring-mumine transition-all">
            </div>
            <div>
                <input type="password" id="regPassword" placeholder="Şifre Belirle" required
                    class="w-full bg-orta border border-zinc-700 text-yazi px-4 py-3 rounded-lg focus:outline-none focus:border-mumine focus:ring-1 focus:ring-mumine transition-all">
            </div>
            <button type="submit"
                class="w-full bg-mumine text-koyu font-semibold py-3 rounded-lg hover:bg-[#e6b88a] active:scale-[0.98] transition-all mt-3">Okur
                Kartı Oluştur</button>
        </form>

        <!-- SOSYAL GİRİŞ -->
        <div class="mt-8 pt-6 border-t border-zinc-800 text-center">
            <p class="text-xs text-yaziAcik mb-4">Hızlı Erişim</p>
            <div class="flex justify-center gap-4">
                <button onclick="loginWithGoogle()"
                    class="w-12 h-12 rounded-full bg-orta border border-zinc-700 flex items-center justify-center text-yazi hover:border-mumine hover:text-mumine transition-all"><i
                        class="ph-fill ph-google-logo text-xl"></i></button>
                <button onclick="loginWithDiscord()"
                    class="w-12 h-12 rounded-full bg-orta border border-zinc-700 flex items-center justify-center text-yazi hover:border-[#5865F2] hover:text-[#5865F2] transition-all"><i
                        class="ph-fill ph-discord-logo text-xl"></i></button>
                <button onclick="loginWithTwitter()"
                    class="w-12 h-12 rounded-full bg-orta border border-zinc-700 flex items-center justify-center text-yazi hover:border-[#1DA1F2] hover:text-[#1DA1F2] transition-all"><i
                        class="ph-fill ph-twitter-logo text-xl"></i></button>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="text-sm text-yaziAcik hover:text-mumine transition-colors">← Ana Sayfaya Dön</a>
        </div>
    </div>

    <!-- ŞİFRE SIFIRLAMA MODALI -->
    <div id="reset-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-[2px] flex justify-center items-center z-50 transition-all duration-300 opacity-0 invisible">

        <div
            class="modal-content bg-koyu w-[90%] max-w-[420px] p-8 rounded-2xl border border-zinc-800 shadow-2xl relative flex flex-col gap-6 transform transition-all duration-300 translate-y-5 scale-95">

            <button onclick="closeResetModal()"
                class="absolute top-4 right-4 text-yaziAcik hover:text-mumine transition-colors">
                <i class="ph ph-x text-2xl"></i>
            </button>

            <div class="text-center">
                <div
                    class="w-14 h-14 bg-mumine/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-mumine/20">
                    <i class="ph-fill ph-lock-key-open text-2xl text-mumine"></i>
                </div>
                <h3 class="text-xl font-semibold text-yazi mb-1">Hesabını Kurtar</h3>
                <p class="text-sm text-yaziAcik">Kod gönderip şifreni yenile.</p>
            </div>

            <div class="flex flex-col gap-5">
                <!-- E-Posta Gönderme -->
                <div>
                    <label class="block text-[11px] font-bold text-yaziAcik tracking-wider mb-2">E-POSTA</label>
                    <div class="flex gap-2">
                        <input type="email" id="resetEmail" placeholder="mail@adresin.com"
                            class="flex-1 bg-orta border border-zinc-700 text-yazi px-3 py-2.5 rounded-lg focus:outline-none focus:border-mumine text-sm transition-colors">
                        <button onclick="sendCode()" id="sendCodeBtn"
                            class="bg-acik border border-zinc-600 text-yazi px-4 py-2.5 rounded-lg text-sm font-medium hover:border-mumine hover:text-mumine transition-all whitespace-nowrap">Kod
                            Gönder</button>
                    </div>
                </div>

                <!-- Gelen Kod -->
                <div>
                    <label class="block text-[11px] font-bold text-yaziAcik tracking-wider mb-2">GELEN KOD</label>
                    <input type="text" id="resetCode" placeholder="######" maxlength="6"
                        class="w-full bg-orta border border-zinc-700 text-mumine px-4 py-3 rounded-lg text-center text-xl font-mono tracking-[0.5em] focus:outline-none focus:border-mumine transition-colors">
                </div>

                <!-- Yeni Şifre -->
                <div class="relative">
                    <label class="block text-[11px] font-bold text-yaziAcik tracking-wider mb-2">YENİ ŞİFRE</label>
                    <input type="password" id="resetNewPass" placeholder="Yeni şifren..."
                        class="w-full bg-orta border border-zinc-700 text-yazi px-4 py-2.5 rounded-lg focus:outline-none focus:border-mumine text-sm transition-colors pr-10">
                    <button onclick="togglePasswordVisibility()"
                        class="absolute bottom-2 right-3 text-yaziAcik hover:text-yazi">
                        <i class="ph ph-eye-slash text-lg" id="togglePassIcon"></i>
                    </button>
                </div>
            </div>

            <button onclick="verifyAndReset()"
                class="w-full bg-mumine text-koyu font-semibold py-3 rounded-lg hover:bg-[#e6b88a] active:scale-[0.98] transition-all mt-2">Şifreyi
                Değiştir</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="/js/login.js"></script>

    <script>
        // Senin orijinal JS dosyanın içindeki form gösterme/gizleme mantığını
        // Tailwind ile tam uyumlu hale getiriyoruz.
        window.switchTab = function (tabName) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTab');
            const regBtn = document.getElementById('registerTab');

            if (tabName === 'login') {
                // Formları Ayarla
                loginForm.className = "flex flex-col gap-4";
                regForm.className = "hidden flex-col gap-4";

                // Butonları Ayarla
                loginBtn.className = "flex-1 py-2 rounded-md text-sm font-medium transition-all duration-300 bg-acik text-mumine shadow-sm";
                regBtn.className = "flex-1 py-2 rounded-md text-sm font-medium text-yaziAcik hover:text-yazi transition-all duration-300 bg-transparent shadow-none";
            } else {
                // Formları Ayarla
                regForm.className = "flex flex-col gap-4";
                loginForm.className = "hidden flex-col gap-4";

                // Butonları Ayarla
                regBtn.className = "flex-1 py-2 rounded-md text-sm font-medium transition-all duration-300 bg-acik text-mumine shadow-sm";
                loginBtn.className = "flex-1 py-2 rounded-md text-sm font-medium text-yaziAcik hover:text-yazi transition-all duration-300 bg-transparent shadow-none";
            }
        };

        // MODAL BYPASS (Tailwind Uyumu İçin)
        window.openResetModal = function () {
            const modal = document.getElementById('reset-modal');
            // Tailwind class'ları ile modalı görünür ve opak yapıyoruz
            modal.classList.remove('opacity-0', 'invisible');
            modal.classList.add('opacity-100', 'visible');

            // Kutunun yukarı kayma efekti için
            const content = modal.querySelector('.modal-content');
            content.classList.remove('translate-y-5', 'scale-95');
            content.classList.add('translate-y-0', 'scale-100');
        };

        window.closeResetModal = function () {
            const modal = document.getElementById('reset-modal');
            // Tailwind class'ları ile modalı gizliyoruz
            modal.classList.remove('opacity-100', 'visible');
            modal.classList.add('opacity-0', 'invisible');

            // Kutunun aşağı kayma efekti için
            const content = modal.querySelector('.modal-content');
            content.classList.remove('translate-y-0', 'scale-100');
            content.classList.add('translate-y-5', 'scale-95');
        };
    </script>
</body>

</html>
